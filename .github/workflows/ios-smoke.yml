name: iOS simulator smoke
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main iOS build run ID (blank selects latest)
        required: false
        type: string
  workflow_run:
    workflows: [iOS simulator build]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    concurrency:
      group: ios-smoke-main
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Select matching native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/ios.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$run_id" > "$RUNNER_TEMP/tiny-wins-build.json"
          build_sha=$(node -e 'const r=require(process.argv[1]); if(r.conclusion!=="success" || r.head_branch!=="main" || r.name!=="iOS simulator build" || r.event!=="push") process.exit(1); console.log(r.head_sha)' "$RUNNER_TEMP/tiny-wins-build.json")
          git diff --exit-code "$build_sha" HEAD -- src assets app.json package.json package-lock.json metro.config.js babel.config.js scripts/patch-expo-sqlite.mjs scripts/patch-security-dependencies.mjs
          echo "Testing iOS artifact from $build_sha (run $run_id)"
          gh run download "$run_id" --name tiny-wins-ios-simulator --dir "$RUNNER_TEMP/tiny-wins-artifact"
          ditto -x -k "$RUNNER_TEMP/tiny-wins-artifact/tiny-wins-ios-simulator.zip" "$RUNNER_TEMP/tiny-wins-app"
      - run: npm ci
      - name: Install pinned Maestro CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Boot available iPhone simulator
        timeout-minutes: 6
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/tiny-wins-devices.json"
          udid=$(node -e 'const d=require(process.argv[1]);const phone=Object.entries(d.devices).filter(([runtime])=>runtime.includes(".iOS-")).sort(([a],[b])=>b.localeCompare(a,undefined,{numeric:true})).flatMap(([,devices])=>devices).find(d=>d.isAvailable && d.name.startsWith("iPhone") && d.state==="Shutdown");if(!phone)throw new Error("No available iPhone simulator");console.log(phone.udid)' "$RUNNER_TEMP/tiny-wins-devices.json")
          echo "TINY_WINS_SIMULATOR=$udid" >> "$GITHUB_ENV"
          echo "Booting iPhone simulator $udid"
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/tiny-wins-app/TinyWins.app"
      - name: Start local development bundle server
        timeout-minutes: 4
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiny-wins-smoke"
          CI=1 npx expo start --localhost --port 8081 > "$RUNNER_TEMP/tiny-wins-smoke/metro.log" 2>&1 &
          for attempt in $(seq 1 120); do
            status=$(curl --fail --silent --max-time 1 http://localhost:8081/status || true)
            if [ "$status" = "packager-status:running" ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tiny-wins-smoke/metro.log"
          exit 1
      - name: Prepare cold iOS development bundle
        timeout-minutes: 6
        run: curl --fail --silent --show-error --max-time 300 "http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&lazy=true&minify=false&inlineSourceMap=false&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server&app=app.tinywins.mobile" -o "$RUNNER_TEMP/tiny-wins-ios.bundle"
      - name: Run restart and management acceptance flows
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
          MAESTRO_DISABLE_UPDATE_CHECK: 'true'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
          MAESTRO_API_URL: http://127.0.0.1:9
        run: maestro --device "$TINY_WINS_SIMULATOR" test --format JUNIT --output "$RUNNER_TEMP/tiny-wins-smoke/results.xml" --debug-output "$RUNNER_TEMP/tiny-wins-smoke/debug" --test-output-dir "$RUNNER_TEMP/tiny-wins-smoke/screenshots" .maestro/first-win.yaml .maestro/habit-management.yaml
      - name: Capture simulator outcome
        if: always()
        run: |
          xcrun simctl list devices available
          if [ -n "${TINY_WINS_SIMULATOR:-}" ]; then
            mkdir -p "$RUNNER_TEMP/tiny-wins-smoke"
            xcrun simctl io "$TINY_WINS_SIMULATOR" screenshot "$RUNNER_TEMP/tiny-wins-smoke/simulator.png"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tiny-wins-ios-smoke
          path: ${{ runner.temp }}/tiny-wins-smoke
          if-no-files-found: warn
          retention-days: 7
