appId: app.tinywins.mobile
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read a chapter, 1 win in a row
    timeout: 120000
- takeScreenshot: cozy-large-text-today
- scrollUntilVisible:
    element: View Read a chapter, 1 win in a row
    direction: DOWN
    centerElement: true
- takeScreenshot: cozy-large-text-habit
- tapOn: View Read a chapter, 1 win in a row
- assertVisible: Edit habit
- assertVisible: Go back
- assertVisible: Previous month
- assertVisible: Next month
- takeScreenshot: cozy-large-text-detail
- tapOn: Edit habit
- assertVisible: Close habit editor
- takeScreenshot: cozy-large-text-editor
- scrollUntilVisible:
    element: Cancel
    direction: DOWN
    centerElement: false
- assertVisible: Save changes
- assertVisible: Archive habit
- assertVisible: Cancel
- takeScreenshot: cozy-large-text-editor-actions
- tapOn: Cancel
- tapOn:
    id: inspect-today
- assertVisible: Close day
- takeScreenshot: cozy-large-text-day
- tapOn: Close day
- tapOn: Go back
- assertVisible: View Read a chapter, 1 win in a row

- tapOn: Insights, tab, 2 of 3
- assertVisible: Week
- assertVisible: Month
- assertVisible: Year
- takeScreenshot: cozy-large-text-insights
- scrollUntilVisible:
    element: View Read a chapter progress
    direction: DOWN
    centerElement: true
- takeScreenshot: cozy-large-text-wall
- tapOn:
    text: Settings, tab, 3 of 3
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: celebration-animations
    direction: DOWN
    centerElement: true
- assertVisible: Celebration animations, on
- takeScreenshot: cozy-large-text-settings
