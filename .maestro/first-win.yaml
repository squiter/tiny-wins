appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- runFlow:
    when:
      notVisible: Close habit editor
    commands:
      - tapOn:
          id: add-habit
          retryTapIfNoChange: true
- assertVisible: Close habit editor
- tapOn:
    id: toggle-starter-ideas
- tapOn:
    id: starter-idea-water
- assertVisible:
    id: starter-idea-water
    text: 'Use idea: Drink water, selected'
- tapOn:
    id: starter-idea-read
- assertVisible:
    id: habit-name
    text: Read one page
- assertVisible:
    id: starter-idea-read
    text: 'Use idea: Read one page, selected'
- takeScreenshot: starter-ideas-english
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- tapOn: Complete Read one page today
- assertVisible: View Read one page, 1 win in a row
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read one page, 1 win in a row
    timeout: 120000
- tapOn: Undo Read one page today
- assertVisible: View Read one page, 0 wins in a row
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read one page, 0 wins in a row
    timeout: 120000
