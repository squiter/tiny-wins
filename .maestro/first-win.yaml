appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- tapOn:
    id: habit-name
- inputText: Read one page
- tapOn: Done typing
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- tapOn: Complete Read one page today
- assertVisible: View Read one page, 1 win in a row
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read one page, 1 win in a row
    timeout: 120000
- tapOn: Undo Read one page today
- assertVisible: View Read one page, 0 wins in a row
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read one page, 0 wins in a row
    timeout: 120000
