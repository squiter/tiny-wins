appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- tapOn:
    id: habit-name
- inputText: Read one page
- hideKeyboard
- tapOn:
    id: save-habit
- tapOn: Complete Read one page today
- assertVisible: View Read one page, 1 day in a row
- stopApp
- launchApp
- assertVisible: View Read one page, 1 day in a row
- tapOn: Undo Read one page today
- assertVisible: View Read one page, 0 days in a row
- stopApp
- launchApp
- assertVisible: View Read one page, 0 days in a row
