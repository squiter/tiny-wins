appId: app.tinywins.mobile
---
# CI changes the dedicated simulator's OS language before this flow.
# No saved language override: Portuguese must come from the native API.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- assertVisible: Hoje
- assertVisible: Comece com uma pequena coisa.
- tapOn:
    text: Ajustes(, tab, 3 of 3)?
    retryTapIfNoChange: true
# A cold OS-language reboot can drop the first navigation tap. Reopen the
# same tab once only when its required screen root has not appeared.
- runFlow:
    when:
      notVisible:
        id: settings-theme-(light|dark)
    commands:
      - tapOn:
          text: Ajustes(, tab, 3 of 3)?
          retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: language-system
    direction: DOWN
    centerElement: true
- assertVisible:
    id: language-system
    text: Sistema, selecionado
- assertVisible: Idioma
- takeScreenshot: language-system-portuguese-large-settings
- tapOn:
    id: language-en
- assertVisible: Language
- assertVisible:
    id: language-en
    text: English, selected
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- assertVisible: Today
- tapOn:
    text: Settings(, tab, 3 of 3)?
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: language-system
    direction: DOWN
    centerElement: true
- tapOn:
    id: language-system
- assertVisible: Idioma
- assertVisible:
    id: language-system
    text: Sistema, selecionado
- takeScreenshot: language-system-portuguese-restored
- tapOn: Hoje(, tab, 1 of 3)?
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: add-habit
    commands:
      - tapOn:
          id: add-habit
          retryTapIfNoChange: true
- assertVisible: Fechar editor de hábito
- assertVisible: Novo hábito
- takeScreenshot: language-portuguese-large-editor
- scrollUntilVisible:
    element:
      id: toggle-starter-ideas
    direction: DOWN
    centerElement: true
- tapOn:
    id: toggle-starter-ideas
- scrollUntilVisible:
    element:
      id: starter-idea-walk
    direction: DOWN
    centerElement: true
- tapOn:
    id: starter-idea-walk
- assertVisible:
    id: starter-idea-walk
    text: 'Usar ideia: Fazer uma caminhada curta, selecionada'
- takeScreenshot: starter-ideas-portuguese-large
- scrollUntilVisible:
    element:
      id: frequency-weekly
    direction: DOWN
    centerElement: true
- tapOn:
    id: frequency-weekly
- scrollUntilVisible:
    element:
      id: weekly-goal-target
    direction: DOWN
    centerElement: true
- assertVisible:
    id: weekly-goal-target
    text: 3 dias por semana
- takeScreenshot: weekly-goal-portuguese-large
- scrollUntilVisible:
    element: Cancelar
    direction: DOWN
    centerElement: true
- assertVisible: Criar hábito
- assertVisible: Cancelar
- takeScreenshot: language-portuguese-large-editor-actions
- tapOn: Cancelar
- assertVisible:
    id: add-habit
- tapOn: Progresso(, tab, 2 of 3)?
- assertVisible: Progresso
- takeScreenshot: language-portuguese-large-insights-header
- scrollUntilVisible:
    element: Sua primeira vitória é um começo.
    direction: DOWN
- assertVisible: Sua primeira vitória é um começo.
- takeScreenshot: language-portuguese-large-insights
