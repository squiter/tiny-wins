appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- tapOn:
    id: habit-name
- inputText: Read one page
- tapOn: Done typing
- takeScreenshot: habit-editor-safe-area
- tapOn: Book icon
- tapOn: coral color
- scrollUntilVisible:
    element:
      text: Advanced options.*
    direction: DOWN
- tapOn:
    text: Advanced options.*
- scrollUntilVisible:
    element: Increase streak tolerance
    direction: DOWN
- tapOn: Increase streak tolerance
- scrollUntilVisible:
    element:
      id: streak-tolerance
    direction: DOWN
- assertVisible: 1 scheduled day of tolerance
- takeScreenshot: streak-flexibility-controls
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- tapOn: Complete Read one page today
- assertVisible: View Read one page, 1 win in a row
- tapOn: View Read one page, 1 win in a row
- tapOn: Edit habit
- scrollUntilVisible:
    element:
      text: Advanced options.*
    direction: DOWN
- tapOn:
    text: Advanced options.*
- scrollUntilVisible:
    element:
      id: streak-tolerance
    direction: DOWN
- assertVisible: 1 scheduled day of tolerance
- scrollUntilVisible:
    element:
      id: habit-name
    direction: UP
- tapOn:
    id: habit-name
- eraseText
- inputText: Read a chapter
- tapOn: Done typing
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- assertVisible: Read a chapter
- tapOn: Go back
- tapOn:
    id: add-habit
- tapOn:
    id: habit-name
- inputText: Walk
- tapOn: Done typing
- tapOn: Walk icon
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- tapOn: Reorder habits
- tapOn: Move Walk up
- tapOn: Done reordering
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read a chapter, 1 win in a row
    timeout: 120000
- tapOn: View Read a chapter, 1 win in a row
- tapOn: Edit habit
- scrollUntilVisible:
    element: Archive habit
    direction: DOWN
- tapOn: Archive habit
- tapOn: Go back
- scrollUntilVisible:
    element: 'Archived habits \(1\)'
    direction: DOWN
- tapOn: 'Archived habits \(1\)'
- tapOn: Restore Read a chapter
- tapOn: '← Back to Today'
- assertVisible: View Read a chapter, 1 win in a row
- stopApp
- launchApp
- extendedWaitUntil:
    visible: View Read a chapter, 1 win in a row
    timeout: 120000
