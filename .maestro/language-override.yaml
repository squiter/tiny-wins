appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    text: Settings(, tab, 3 of 3)?
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: language-pt-BR
    direction: DOWN
    centerElement: true
- tapOn:
    id: language-pt-BR
- assertVisible: Idioma
- assertVisible:
    id: language-pt-BR
    text: 'Português \(Brasil\), selecionado'
- takeScreenshot: language-portuguese-settings
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
    retryTapIfNoChange: true
- runFlow:
    when:
      notVisible: Fechar editor de hábito
    commands:
      - tapOn:
          id: add-habit
          retryTapIfNoChange: true
- assertVisible: Fechar editor de hábito
- assertVisible: Novo hábito
- tapOn:
    id: toggle-starter-ideas
- tapOn:
    id: starter-idea-water
- assertVisible:
    id: habit-name
    text: Beber água
- tapOn: Fechar editor de hábito
- assertVisible: Comece com uma pequena coisa.
