appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    text: Settings, tab, 3 of 3
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: language-pt-BR
    direction: DOWN
    centerElement: true
- tapOn:
    id: language-pt-BR
- assertVisible: Idioma
- assertVisible:
    id: language-pt-BR
    text: 'Português \(Brasil\), selecionado'
- takeScreenshot: language-portuguese-settings
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    id: add-habit
- assertVisible: Novo hábito
- tapOn:
    id: habit-name
- inputText: Quiet reading
- assertVisible: Quiet reading
- tapOn: Terminei de escrever
- scrollUntilVisible:
    element:
      id: save-habit
    direction: DOWN
- tapOn:
    id: save-habit
- assertVisible: Ver Quiet reading, 0 vitória seguida
- tapOn: Concluir Quiet reading hoje
- assertVisible: '(?s)Tudo feito por hoje!.*'
- takeScreenshot: language-portuguese-win
- tapOn: Ver Quiet reading, 1 vitória seguida
- tapOn:
    id: inspect-today
- scrollUntilVisible:
    element:
      id: day-note
    direction: DOWN
- tapOn:
    id: day-note
- inputText: Uma pagina, ja valeu.
- assertVisible: Uma pagina, ja valeu.
- scrollUntilVisible:
    element:
      id: day-note-done-typing
    direction: DOWN
- tapOn:
    id: day-note-done-typing
- scrollUntilVisible:
    element:
      id: save-day-note
    direction: DOWN
- tapOn:
    id: save-day-note
- assertVisible: Nota salva.
- scrollUntilVisible:
    element: Fechar dia
    direction: DOWN
- tapOn: Fechar dia
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn: Ver Quiet reading, 1 vitória seguida
- tapOn:
    id: inspect-today
- scrollUntilVisible:
    element: Uma pagina, ja valeu.
    direction: DOWN
- assertVisible: Uma pagina, ja valeu.
- assertVisible: Uma vitória para guardar.
- takeScreenshot: language-portuguese-note-restart
- tapOn: Fechar dia
- tapOn: Voltar
- tapOn:
    text: Ajustes, tab, 3 of 3
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: language-en
    direction: DOWN
    centerElement: true
- tapOn:
    id: language-en
- assertVisible: Language
- assertVisible:
    id: language-en
    text: English, selected
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- assertVisible: Today
- assertVisible: View Quiet reading, 1 win in a row
- tapOn: View Quiet reading, 1 win in a row
- tapOn:
    id: inspect-today
- assertVisible: Uma pagina, ja valeu.
- assertVisible: A win worth keeping.
- tapOn: Close day
