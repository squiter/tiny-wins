appId: app.tinywins.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    text: Settings, tab, 3 of 3
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: appearance-dark
    direction: DOWN
    centerElement: true
- tapOn:
    id: appearance-dark
- assertVisible: Dark appearance, selected
- takeScreenshot: appearance-dark-settings
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: add-habit
    timeout: 120000
- tapOn:
    text: Settings, tab, 3 of 3
    retryTapIfNoChange: true
- assertVisible:
    id: settings-theme-(light|dark)
- scrollUntilVisible:
    element:
      id: appearance-dark
    direction: DOWN
    centerElement: true
- assertVisible: Dark appearance, selected
- tapOn:
    id: appearance-light
- assertVisible: Light appearance, selected
- takeScreenshot: appearance-light-settings
- tapOn:
    id: appearance-system
- assertVisible: System appearance, selected
